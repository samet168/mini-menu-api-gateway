services:
  mini-menu-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-menu-api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://host.docker.internal:8001
      - CATALOG_SERVICE_URL=http://host.docker.internal:8002
      - ORDER_SERVICE_URL=http://host.docker.internal:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
